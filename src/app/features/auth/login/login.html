<div class="login-container">

  <div class="login-left">
    <div class="overlay"></div>
    <div class="left-content">
      <h2>Transforma tu cuerpo,<br>transforma tu vida.</h2>
      <p>El sistema de gestión más completo para tu gimnasio.</p>
    </div>
  </div>

  <div class="login-right">
    <div class="login-form-wrap">

      <div class="login-brand">
        <span class="brand-text">CODICE<span class="brand-accent">GYM</span></span>
      </div>

      <div class="login-title">
        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <i class="pi pi-envelope"></i>
          <input
            type="email"
            [(ngModel)]="correo"
            placeholder="admin@codice.com"
            (keyup.enter)="iniciarSesion()">
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrap">
          <i class="pi pi-lock"></i>
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            [(ngModel)]="contrasena"
            placeholder="••••••••"
            (keyup.enter)="iniciarSesion()">
          <button class="toggle-pass" (click)="togglePassword()">
            <i class="pi" [ngClass]="mostrarPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMsg">
        <i class="pi pi-exclamation-circle"></i>
        {{ errorMsg }}
      </div>

      <button class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
        <span *ngIf="!cargando">
          <i class="pi pi-sign-in"></i>
          Iniciar sesión
        </span>
        <span *ngIf="cargando">
          <i class="pi pi-spin pi-spinner"></i>
          Verificando...
        </span>
      </button>

    </div>
  </div>

</div>
